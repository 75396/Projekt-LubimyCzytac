<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt: LubimyCzytać</title>
    <link id="stylStrony" rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Biblioteka</h1>
    
    <section>
        <h2>Dodaj książkę</h2>
        <label for="tytul">Tytuł:</label>
        <input type="text" id="tytul">

        <label for="autor">Autor:</label>
        <input type="text" id="autor">

        <label for="rok">Rok wydania:</label>
        <input type="number" id="rok">

        <button id="dodajKsiazke">Dodaj książkę</button>
    </section>
    
    <section>
        <input type="text" id="wyszukiwarka" placeholder="Szukaj książki...">
        <h2>Lista książek</h2>
        <ul id="listaKsiazek"></ul>
    </section>
    
   <section>
    <h2>Szczegóły książki</h2>
    <div id="szczegolyKsiazki">
        Wybierz książkę z listy.
    </div>
    <button id="usunKsiazke" style="display:none;">
        Usuń książkę
    </button>
       <h3>Opinie użytkowników</h3>
<div id="opinie">
    Brak opinii.
</div>
<h3>Dodaj opinię</h3>
<input type="text" id="autorOpinii" placeholder="Twoje imię">
<textarea
    id="trescOpinii"
    placeholder="Napisz opinię..."
></textarea>
<button id="dodajOpinie">
    Dodaj opinię
</button>
       
</section>
    <script src="script.js"></script>
</body>
</html>
