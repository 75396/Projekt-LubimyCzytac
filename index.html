<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt: LubimyCzytać</title>
    <link id="stylStrony" rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Biblioteka</h1>
    <section>
        <h2>Dodaj książkę</h2>

        <label for="tytul">Tytuł:</label>
        <input type="text" id="tytul">

        <label for="autor">Autor:</label>
        <input type="text" id="autor">

        <label for="rok">Rok wydania:</label>
        <input type="number" id="rok">

        <button id="dodajKsiazke">Dodaj książkę</button>
    </section>
    <section>
        <h2>Lista książek</h2>
        <ul id="listaKsiazek"></ul>
    </section>
    <section>
        <h2>Szczegóły książki</h2>
        <div id="szczegolyKsiazki">
            Wybierz książkę z listy.
        </div>
    </section>
    <script src="script.js"></script>
</body>
</html>
